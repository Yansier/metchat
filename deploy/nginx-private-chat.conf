server {
    listen 80;
    server_name chat.example.com;

    # Only this directory is public. Never point root at the project directory.
    root /www/wwwroot/private-ephemeral-chat/public;
    index index.html;

    access_log /www/wwwlogs/private-ephemeral-chat.access.log;
    error_log  /www/wwwlogs/private-ephemeral-chat.error.log warn;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:2346;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }

    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
}

